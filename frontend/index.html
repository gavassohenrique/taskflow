<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>TaskFlow</h1>
        <p>Gerenciamento de tarefas</p>
    </header>

    <main>

        <section class="dashboard">

            <div class="card">
                <h2 id="totalTarefas">0</h2>
                <p>Total</p>
            </div>

            <div class="card">
                <h2 id="pendentes">0</h2>
                <p>Pendentes</p>
            </div>

            <div class="card">
                <h2 id="andamento">0</h2>
                <p>Em andamento</p>
            </div>

            <div class="card">
                <h2 id="concluidas">0</h2>
                <p>Concluídas</p>
            </div>

        </section>

        <section class="formulario">

            <h2>Nova tarefa</h2>

            <input
                type="text"
                id="titulo"
                placeholder="Título da tarefa"
            >

            <textarea
                id="descricao"
                placeholder="Descrição"
            ></textarea>

            <select id="prioridade">

                <option value="Baixa">
                    Baixa
                </option>

                <option value="Média" selected>
                    Média
                </option>

                <option value="Alta">
                    Alta
                </option>

            </select>

            <input type="date" id="prazo">

            <button onclick="criarTarefa()">
                Criar tarefa
            </button>

        </section>

        <section>

            <h2>Minhas tarefas</h2>

            <div id="listaTarefas"></div>

        </section>

    </main>

<script>
    window.TASKFLOW_API_URL =
        "https://taskflow-backend.greensea-e3578c09.brazilsouth.azurecontainerapps.io/api/tarefas";
</script>

<script src="script.js"></script>

</body>

</html>

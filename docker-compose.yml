services:

  frontend:
    build: ./frontend
    container_name: taskflow_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: taskflow_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: taskflow-postgres2026.postgres.database.azure.com
      DB_PORT: 5432
      DB_NAME: taskflow
      DB_USER: taskflowadmin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "true"